<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      width: 340px; margin: 0; padding: 14px;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      font-size: 13px; color: #1f2937; background: #f3f4f6; line-height: 1.5;
    }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; color: #111827; }
    h1 .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; display: inline-block; transition: background .15s; }
    h1 .dot.on { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
    h1 .muted { font-size: 12px; color: #6b7280; margin-left: 4px; }
    .card {
      background: #ffffff; border: 1px solid #e5e7eb; border-radius: 10px;
      padding: 12px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(0,0,0,.04);
    }
    .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .row > label { font-size: 11px; color: #6b7280; min-width: 74px; }
    input[type=text] {
      flex: 1; padding: 7px 9px; border-radius: 6px;
      border: 1px solid #d1d5db; background: #ffffff; color: #1f2937; font-size: 12px;
    }
    input[type=text]:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px rgba(99,102,241,.15); }
    .mode-toggle {
      display: inline-flex; border: 1px solid #d1d5db; border-radius: 20px; overflow: hidden;
      background: #f9fafb; padding: 2px;
    }
    .mode-toggle button {
      border: none; background: transparent; color: #6b7280; font-weight: 600;
      padding: 5px 12px; font-size: 12px; cursor: pointer; border-radius: 18px;
      transition: all .12s;
    }
    .mode-toggle button.active {
      background: #6366f1; color: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.1);
    }
    .mode-toggle button:not(.active):hover { color: #374151; }
    .mode-label { font-size: 11px; color: #6b7280; margin-bottom: 6px; }
    .btn-primary {
      width: 100%; padding: 10px; border: none; border-radius: 8px;
      background: #6366f1; color: #fff; font-weight: 700; font-size: 13px; cursor: pointer;
    }
    .btn-primary:hover { filter: brightness(1.06); }
    .btn-primary:disabled { opacity: .5; cursor: not-allowed; }
    .btn-secondary {
      width: 100%; padding: 9px; border: 1px solid #d1d5db; background: #fff;
      color: #1f2937; font-weight: 600; font-size: 13px; cursor: pointer; border-radius: 8px;
    }
    .btn-secondary:hover { background: #f9fafb; }
    .btn-secondary:disabled { opacity: .5; cursor: not-allowed; }
    .status {
      display: flex; align-items: center; gap: 8px; font-size: 12px; color: #6b7280;
      padding: 8px 10px; background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 8px;
      margin-bottom: 10px;
    }
    .status .counts { display: flex; gap: 12px; margin-left: auto; font-weight: 600; }
    .status .counts span { font-size: 12px; }
    .status .counts .pending { color: #ca8a04; }
    .status .counts .processing { color: #2563eb; }
    .status .counts .done { color: #16a34a; }
    .status .counts .failed { color: #dc2626; }
    .status.offline { color: #dc2626; }
    #log {
      margin-top: 4px; padding: 8px; min-height: 50px; max-height: 120px; overflow-y: auto;
      background: #f9fafb; border: 1px solid #e5e7eb; border-radius: 6px;
      font-size: 11.5px; line-height: 1.5; color: #4b5563; white-space: pre-wrap; word-break: break-word;
    }
    #log .ok { color: #16a34a; }
    #log .err { color: #dc2626; }
    #log .muted { color: #9ca3af; }
    .hint { font-size: 11px; color: #9ca3af; margin-top: 6px; }
    .hint b { color: #6366f1; }
    .flex-between { display: flex; justify-content: space-between; align-items: center; }
  </style>
</head>
<body>
  <h1><span class="dot" id="dot"></span> ScrollWright <span class="muted" id="srv"></span></h1>

  <button id="startBtn" class="btn-primary">▶ Start ScrollWright</button>
  <button id="configureBtn" class="btn-secondary" style="width:100%;margin-top:6px">⚙ Configure paths &amp; vault</button>

  <div class="card" style="padding:10px 12px">
    <div class="mode-label">Floating button</div>
    <div class="mode-toggle" role="group" aria-label="Floating button mode">
      <button id="modeNote" class="active">📝 Note this reel</button>
      <button id="modeScroll">📥 Scroll / harvest</button>
    </div>
    <div class="mode-label" style="margin-top:8px">Note content</div>
    <div class="mode-toggle" role="group" aria-label="Note content">
      <button id="watchVideo" class="active">🎬 Video + transcript</button>
      <button id="watchText">📝 Transcript only</button>
    </div>
    <div class="hint">Video = Gemini watches it · Transcript only ≈ 4× fewer tokens.</div>
  </div>

  <div class="status" id="status">
    <span id="statusText">checking…</span>
    <span class="counts" id="counts"></span>
  </div>

  <button id="noteThis" class="btn-secondary" disabled>📝 Note this reel</button>
  <button id="harvest" class="btn-secondary" disabled>📥 Harvest saved folder</button>

  <div id="log"></div>
  <div class="hint">▶ Start copies the run command — paste in a terminal, hit Enter. Web UI opens in a new tab.</div>

  <script src="popup.js"></script>
</body>
</html>
